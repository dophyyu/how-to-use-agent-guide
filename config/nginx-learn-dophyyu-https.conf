server {
    listen 80;
    listen [::]:80;
    server_name learn.dophyyu.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learn.dophyyu.cn;

    ssl_certificate /etc/letsencrypt/live/learn.dophyyu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.dophyyu.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/how-to-use-agent-guide/current;
    index index.html;

    access_log /var/log/nginx/how-to-use-agent-guide.access.log;
    error_log /var/log/nginx/how-to-use-agent-guide.error.log;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
